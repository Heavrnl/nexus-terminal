name: Build Remote Session Agent (nexus-mux)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            ext: ''
            use_alpine_docker: true
          - os: linux
            arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            ext: ''
            use_alpine_docker: true
          - os: darwin
            arch: universal
            target: aarch64-apple-darwin,x86_64-apple-darwin
            runner: macos-15
            ext: ''
            use_alpine_docker: false
          - os: windows
            arch: x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            ext: '.exe'
            use_alpine_docker: false

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      # --- Linux 路径：统一在对应架构官方 rust:1-alpine 容器内原生静态构建与单测，
      #     彻底消除 Ubuntu 24.04 宿主机 GCC 13 / musl-tools 链接器版本漂移 ---
      - name: 缓存 Linux Alpine Cargo 依赖
        if: matrix.use_alpine_docker
        uses: actions/cache@v4
        with:
          path: |
            .alpine-cargo/registry/index
            .alpine-cargo/registry/cache
            .alpine-cargo/git/db
          key: nexus-mux-alpine-${{ matrix.arch }}-${{ hashFiles('packages/remote-agent/Cargo.lock') }}
          restore-keys: |
            nexus-mux-alpine-${{ matrix.arch }}-

      - name: 在 Alpine 原生容器内执行单元测试并构建静态 Release 二进制（Linux）
        if: matrix.use_alpine_docker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .alpine-cargo/registry .alpine-cargo/git agent-out
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          NORM_ARCH="${{ matrix.arch }}"
          docker run --rm \
            -v "$PWD/packages/remote-agent:/src" \
            -v "$PWD/.alpine-cargo/registry:/usr/local/cargo/registry" \
            -v "$PWD/.alpine-cargo/git:/usr/local/cargo/git" \
            -v "$PWD/agent-out:/out" \
            -w /src \
            rust:1-alpine \
            sh -euc "
              apk add --no-cache musl-dev >/dev/null
              cargo test --target ${{ matrix.target }} --target-dir /tmp/cargo-target
              cargo build --release --target ${{ matrix.target }} --target-dir /tmp/cargo-target
              cp /tmp/cargo-target/${{ matrix.target }}/release/nexus-mux /out/nexus-mux-linux-${NORM_ARCH}
              chown -R ${HOST_UID}:${HOST_GID} /out /usr/local/cargo/registry /usr/local/cargo/git
            "
          ls -lh "agent-out/nexus-mux-linux-${NORM_ARCH}"

      # --- macOS & Windows 路径：直接使用 Runner 原生工具链编译 ---
      - name: 配置 Rust 工具链（macOS / Windows）
        if: ${{ !matrix.use_alpine_docker }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 启用 Rust 编译缓存（macOS / Windows）
        if: ${{ !matrix.use_alpine_docker }}
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'packages/remote-agent -> target'
          key: nexus-mux-${{ matrix.os }}-${{ matrix.arch }}

      # --- macOS 路径：在单台 macos-15 上一次构建 arm64 + x86_64 双架构，减半 macOS Runner 配额占用 ---
      - name: 运行单元测试并编译双架构 Release 二进制（macOS）
        if: ${{ matrix.os == 'darwin' }}
        working-directory: packages/remote-agent
        shell: bash
        run: |
          set -euo pipefail
          cargo test --target aarch64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: 归档双架构平台产物（macOS）
        if: ${{ matrix.os == 'darwin' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-out
          cp packages/remote-agent/target/aarch64-apple-darwin/release/nexus-mux agent-out/nexus-mux-darwin-aarch64
          cp packages/remote-agent/target/x86_64-apple-darwin/release/nexus-mux agent-out/nexus-mux-darwin-x86_64
          ls -lh agent-out/

      # --- Windows 路径 ---
      - name: 运行单元测试并编译精简 Release 二进制（Windows）
        if: ${{ matrix.os == 'windows' }}
        working-directory: packages/remote-agent
        run: |
          cargo test --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      - name: 归档平台产物（Windows）
        if: ${{ matrix.os == 'windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p agent-out
          cp "packages/remote-agent/target/${{ matrix.target }}/release/nexus-mux${{ matrix.ext }}" \
             "agent-out/nexus-mux-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          ls -lh "agent-out/nexus-mux-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"

      - name: 上传单平台原始产物
        uses: actions/upload-artifact@v4
        with:
          name: nexus-mux-raw-${{ matrix.os }}-${{ matrix.arch }}
          path: agent-out/*
          retention-days: 1

  bundle:
    name: Bundle nexus-mux manifest
    needs: compile
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: 下载全部平台原始二进制
        uses: actions/download-artifact@v4
        with:
          path: raw-agents
          pattern: nexus-mux-raw-*
          merge-multiple: true

      - name: 压缩并生成 manifest.json
        run: node packages/remote-agent/scripts/build-agent.mjs --collect-from raw-agents

      - name: 上传全平台压缩包（供 Docker 与桌面端内置）
        uses: actions/upload-artifact@v4
        with:
          name: nexus-mux-bundle
          path: packages/remote-agent/dist/*
          retention-days: 7
